name: secret-scanner
version: "1.2.0"
description: Scan code and configs for leaked credentials and API keys
capabilities:
  - security
  - secret-scanning
enabled: true
transport:
  type: docker
  image: ghcr.io/dsk-dev-ai/secret-scanner:latest
  command: ["scan", "--format", "sarif"]
permissions:
  filesystem:
    read: true
    write: false
  network:
    deny: true
executionTimeoutMs: 60000